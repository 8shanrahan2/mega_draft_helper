name: Analyze 2023 Mega Draft Champion Effect

on:
  push:
    branches:
      - analysis/champion-effect-2023
    paths:
      - 'analysis/champion_effect_2023.py'
      - '.github/workflows/analyze-champion-2023.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kagglehub

      - name: Pin last downloadable Kaggle version
        run: |
          sed -i 's#DATASET = "s1m0n38/clash-royale-games"#DATASET = "s1m0n38/clash-royale-games/versions/15"#' analysis/champion_effect_2023.py

      - name: Analyze April 2023 Mega Draft
        run: python analysis/champion_effect_2023.py

      - name: Show report
        if: always()
        run: |
          if [ -f analysis/output/champion_effect_2023.md ]; then
            cat analysis/output/champion_effect_2023.md
          fi

      - name: Upload analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-effect-2023
          path: analysis/output/
          if-no-files-found: warn
