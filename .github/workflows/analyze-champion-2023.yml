name: Analyze 2023 Mega Draft Champion Effect

on:
  push:
    branches:
      - analysis/champion-effect-2023
    paths:
      - 'analysis/champion_effect_2023.py'
      - '.github/workflows/analyze-champion-2023.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kagglehub

      - name: Probe Kaggle direct file endpoints
        run: |
          set +e
          for url in \
            'https://www.kaggle.com/api/v1/datasets/download/s1m0n38/clash-royale-games/20230403.csv' \
            'https://www.kaggle.com/api/v1/datasets/download/s1m0n38/clash-royale-games/20230403.csv?datasetVersionNumber=16' \
            'https://www.kaggle.com/api/v1/datasets/download/s1m0n38/clash-royale-games/20230403-20230501%2F20230403.csv' \
            'https://www.kaggle.com/api/v1/datasets/download/s1m0n38/clash-royale-games/20230403-20230501%2F20230403.csv?datasetVersionNumber=16'; do
            echo "=== $url ==="
            curl -sS -L -o /dev/null -w 'HTTP %{http_code} final=%{url_effective} bytes=%{size_download}\n' "$url"
          done

      - name: Analyze April 2023 Mega Draft with KaggleHub
        continue-on-error: true
        run: python analysis/champion_effect_2023.py

      - name: Show report
        if: always()
        run: |
          if [ -f analysis/output/champion_effect_2023.md ]; then
            cat analysis/output/champion_effect_2023.md
          fi

      - name: Upload analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-effect-2023
          path: analysis/output/
          if-no-files-found: warn
