name: Analyze 2026 PickMode Champion Effect

on:
  push:
    branches:
      - analysis/champion-effect-2023
    paths:
      - 'analysis/champion_effect_2026_pickmode.py'
      - '.github/workflows/analyze-champion-2026-pickmode.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub
      - run: python analysis/champion_effect_2026_pickmode.py
      - uses: actions/upload-artifact@v4
        with:
          name: champion-effect-2026-pickmode
          path: analysis/output_2026/
