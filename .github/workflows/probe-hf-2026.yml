name: Probe 2026 Clash Royale Battles

on:
  push:
    branches:
      - analysis/champion-effect-2023
    paths:
      - 'analysis/probe_hf_2026.py'
      - '.github/workflows/probe-hf-2026.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'datasets>=3,<5'
      - run: python analysis/probe_hf_2026.py
