name: Static checks

on:
  push:
    branches:
      - main
      - feature/champion-hero-slot
  pull_request:
    branches:
      - main

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check model-v2.js
          node --check model-v3.js
