name: Static checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check model-v2.js
          node --check model-v3.js
          node --check model-v4.js
          node --check model-v5.js
          node --check model-v6.js
          node --check tests/model-v5.test.js
          node --check tests/model-v6.test.js
      - name: Run model v5 regression checks
        run: node tests/model-v5.test.js
      - name: Run model v6 regression checks
        run: node tests/model-v6.test.js
